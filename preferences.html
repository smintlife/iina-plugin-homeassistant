<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home Assistant Bridge Preferences</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #333;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color: #ddd;
      }
      input {
        background: #2a2a2a;
        color: #fff;
        border: 1px solid #444;
      }
      .card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    }
    body {
      margin: 20px;
      font-size: 13px;
      line-height: 1.5;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .description {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }
    input[type="number"] {
      width: 120px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 13px;
    }
    .card {
      padding: 12px 16px;
      border-radius: 8px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      margin-top: 16px;
    }
    .status-badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #28a745;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <h2>Home Assistant Bridge</h2>
  <p>Konfigurieren Sie den WebSocket-Server für die Home Assistant Integration.</p>

  <div class="form-group">
    <label for="port-input">WebSocket Server Port:</label>
    <input type="number" id="port-input" data-pref-key="port" min="1024" max="65535" step="1" value="8989">
    <div class="description">Standardport: 8989. Ein Neustart von IINA oder erneutes Aktivieren des Plugins übernimmt geänderte Ports.</div>
  </div>

  <div class="card">
    <div><span class="status-badge"></span><strong>WebSocket Server:</strong> Aktiv</div>
    <div class="description" style="margin-top: 6px;">
      Home Assistant verbindet sich per <code>ws://&lt;Mac-IP&gt;:&lt;Port&gt;</code>.
    </div>
  </div>
</body>
</html>
